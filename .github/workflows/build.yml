name: Build JARVIS APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Unzip project
        run: unzip -q jarvis-project.zip -d project

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp project/app/build/outputs/apk/debug/app-debug.apk JARVIS.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: JARVIS build ${{ github.run_number }}
          files: JARVIS.apk
